version: '3.8'

name: 'desafioEnquetes'

services:
    db:
        image: postgres:15-alpine
        restart: unless-stopped
        container_name: desafioEnquetes-db
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=desafioEnquetes_test
        ports:
            - '5432:5432'
        volumes:
            - .data:/var/lib/postgresql/data
